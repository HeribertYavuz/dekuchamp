name: Build driver

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    env:
      WDK_ISO_URL: https://download.microsoft.com/download/4/A/2/4A25C7D5-EFBE-4182-B6A9-AE6850409A78/GRMWDK_EN_7600_1.ISO
    steps:
      - uses: actions/checkout@v4

      - name: Download WDK 7.1 ISO
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:WDK_ISO_URL -OutFile "$env:RUNNER_TEMP\wdk.iso"
          (Get-FileHash "$env:RUNNER_TEMP\wdk.iso" -Algorithm SHA256).Hash

      - name: Extract WDK ISO
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" x "$env:RUNNER_TEMP\wdk.iso" "-o$env:RUNNER_TEMP\wdkiso" -y | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP\wdkiso\WDK" -Filter *.msi | Measure-Object | ForEach-Object { "MSI count: $($_.Count)" }

      - name: Administrative install of WDK 7.1 MSIs
        shell: pwsh
        run: |
          $src = "$env:RUNNER_TEMP\wdkiso\WDK"
          $dst = "C:\wdkadmin"
          New-Item -ItemType Directory -Force $dst | Out-Null
          $skip = 'samples|ia64|readme|toolindex|installhelp|dsf|sdv|swtuner|modemtools|tracingtool|sideshow|avstream|bluetooth|biometric|imaging|wpd|print|wsd|powermanagement|pfd|offreg|cancel|bus|sensor|storage'
          $msis = Get-ChildItem $src -Filter *.msi | Where-Object { $_.Name -notmatch $skip }
          foreach ($m in $msis) {
            $log = "$env:RUNNER_TEMP\logs\$($m.BaseName).log"
            New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\logs" | Out-Null
            $p = Start-Process msiexec -ArgumentList "/a", "`"$($m.FullName)`"", "/qn", "TARGETDIR=`"$dst`"", "/l*v", "`"$log`"" -Wait -PassThru
            Write-Host "$($m.Name) exit $($p.ExitCode)"
          }
          Write-Host "Files extracted: $((Get-ChildItem $dst -Recurse -File).Count)"
          $setenv = Get-ChildItem $dst -Recurse -Filter setenv.bat | Select-Object -First 1
          if (-not $setenv) { throw "setenv.bat not found after extraction" }
          $root = Split-Path (Split-Path $setenv.FullName -Parent) -Parent
          Write-Host "WDK_ROOT=$root"
          "WDK_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build driver and CMD (x64, Win7)
        shell: cmd
        run: |
          call "%WDK_ROOT%\bin\setenv.bat" %WDK_ROOT%\ fre x64 WIN7
          cd /d "%GITHUB_WORKSPACE%"
          where cl.exe
          where link.exe
          build -cg -M 1 > "%RUNNER_TEMP%\build_full.txt" 2>&1
          set BUILD_RC=%errorlevel%
          echo BUILD exit code %BUILD_RC%
          type "%RUNNER_TEMP%\build_full.txt"
          echo ---- outputs
          echo ---- WDK build log
          type "%GITHUB_WORKSPACE%\buildfre_win7_amd64.log"
          echo ---- driver dir tree
          dir /s /a "%GITHUB_WORKSPACE%\DekuchampDriver"
          echo ---- recently written files
          powershell -NoProfile -Command "Get-ChildItem -Path 'D:\a' -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-6) } | Select-Object -First 300 | ForEach-Object { $_.FullName + ' ' + $_.Length }"
          echo ---- link stderr check
          powershell -NoProfile -Command "Get-ChildItem -Path 'C:\wdkadmin' -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt (Get-Date).AddMinutes(-6) } | Select-Object -First 300 | ForEach-Object { $_.FullName + ' ' + $_.Length }"
          for /r %%f in (*.err *.wrn) do (echo ---- %%f & type "%%f")
          if not exist "%GITHUB_WORKSPACE%\DekuchampDriver\objfre_win7_amd64\amd64\Dekuchamp.sys" exit /b 1

      - name: Sign driver and build catalog
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          $inf2cat = Get-ChildItem $env:WDK_ROOT -Recurse -Filter inf2cat.exe | Select-Object -First 1
          $sys = Get-ChildItem "$env:GITHUB_WORKSPACE\DekuchampDriver" -Recurse -Filter Dekuchamp.sys | Where-Object { $_.FullName -match 'amd64' } | Select-Object -First 1
          if (-not $sys) { throw "Dekuchamp.sys (amd64) not found" }
          Write-Host "sys: $($sys.FullName)"
          & $signtool.FullName sign /v /fd sha256 /f "$env:GITHUB_WORKSPACE\certificates\DekuchampTestCert.pfx" /tr http://timestamp.digicert.com /td sha256 $sys.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Copy-Item $sys.Directory.FullName "$env:RUNNER_TEMP\pkg" -Recurse
          & $inf2cat.FullName "/driver:$env:RUNNER_TEMP\pkg" /os:7_X64
          $cat = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Filter *.cat | Select-Object -First 1
          & $signtool.FullName sign /v /fd sha256 /f "$env:GITHUB_WORKSPACE\certificates\DekuchampTestCert.pfx" /tr http://timestamp.digicert.com /td sha256 $cat.FullName
          if ($LASTEXITCODE -ne 0) { throw "catalog signtool failed" }

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\release" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\pkg\*" "$env:RUNNER_TEMP\release" -Force
          $cmd = Get-ChildItem "$env:GITHUB_WORKSPACE" -Recurse -Filter DekuchampCMD.exe | Where-Object { $_.FullName -match 'amd64' } | Select-Object -First 1
          if ($cmd) { Copy-Item $cmd.FullName "$env:RUNNER_TEMP\release\DekuchampCMD_x64.exe" } else { Write-Host "DekuchampCMD.exe not built by WDK (OACR error); skipping" }
          Get-ChildItem "$env:RUNNER_TEMP\release" | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: dekuchamp-driver-x64
          path: ${{ runner.temp }}\release\*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" "$env:RUNNER_TEMP\release\*" --clobber
